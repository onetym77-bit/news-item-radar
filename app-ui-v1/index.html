<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서울 기획 아이템 레이더</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">편집 검토 화면</p>
        <h1>서울 기획 아이템 레이더</h1>
        <p class="subtitle">검토할 사안을 소스별로 나눠 확인합니다.</p>
      </div>
      <div class="run">
        <span class="dot"></span><span>마지막 실행</span>
        <strong id="lastRun">-</strong><small id="dataMode">데이터 확인 중</small>
      </div>
    </header>

    <section class="metrics" id="metrics"></section>

    <section class="filters" aria-label="화면 필터">
      <label>소스 <select id="sourceFilter"><option value="">전체 소스</option></select></label>
      <label>성숙도 <select id="levelFilter"><option value="">전체 단계</option></select></label>
      <label>상태 <select id="statusFilter"><option value="">전체 상태</option></select></label>
    </section>

    <section class="panel">
      <div class="section-head"><h2>사람 판정 대기</h2><span class="muted" id="pendingCount"></span></div>
      <div id="pending"></div>
    </section>

    <section class="panel editorial-panel">
      <div class="section-head"><h2>이번 편집 후보</h2><span class="tag">최대 3건</span></div>
      <div id="editorialBrief"></div>
    </section>

    <section class="panel">
      <div class="section-head"><h2>최신 검토 카드</h2><span class="tag">검토 참고</span></div>
      <div id="cards"></div>
    </section>

    <section class="panel">
      <div class="section-head"><h2>추가 확인 관측</h2><span class="muted">아직 판정하지 않음</span></div>
      <div id="observations"></div>
    </section>

    <section class="panel">
      <div class="section-head"><h2>검토 이력</h2><span class="muted">완료·기각·관찰</span></div>
      <div id="history"></div>
    </section>

    <section class="panel">
      <div class="section-head"><h2>등록 소스</h2><span class="muted">연결 상태</span></div>
      <div id="sources"></div>
    </section>

    <footer><span>읽기 전용 화면</span><span>판정 처리는 GitHub Actions에서 실행</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
