<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 기획 아이템 레이더</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">READ-ONLY EDITORIAL OPERATIONS</p><h1>서울 기획 아이템 레이더</h1><p class="muted">수집·검증·편집 상태를 한 화면에서 확인합니다.</p></div><div class="run"><span class="dot"></span><span>마지막 실행</span><strong id="lastRun">-</strong><small id="dataMode">데이터 확인 중</small></div></header><section class="metrics" id="metrics"></section><section class="filters" aria-label="화면 필터"><label>소스 <select id="sourceFilter"><option value="">전체</option></select></label><label>성숙도 <select id="levelFilter"><option value="">전체</option></select></label><label>검토 상태 <select id="statusFilter"><option value="">전체</option></select></label></section><section class="layout"><aside><h2>소스 상태</h2><div id="sources"></div></aside><section><div class="section-head"><h2>최신 검토 카드</h2><span class="tag">사람 판정 필요</span></div><div id="cards"></div></section><aside><h2>실행 큐</h2><div id="queue"></div></aside></section><section class="pending-panel"><div class="section-head"><h2>사람 판정 대기 목록</h2><span class="muted" id="pendingCount"></span></div><div id="pending"></div></section><section class="history-panel"><div class="section-head"><h2>검토 이력</h2><span class="muted">장부 기준</span></div><div id="history"></div></section><section class="history-panel"><div class="section-head"><h2>소스별 대기 현황</h2><span class="muted">현재 대기 표본</span></div><div id="sourcePerformance"></div></section><footer><span>읽기 전용 화면</span><span>장부·브리핑 자동 수정 없음</span></footer></main><script src="app.js"></script></body>
</html>
