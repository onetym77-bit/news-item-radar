name: Record editorial decision

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Candidate ID from the review queue
        required: true
        type: string
      decision:
        description: COMPLETE or DISCARD
        required: true
        type: choice
        options:
          - COMPLETE
          - DISCARD
      note:
        description: Optional note
        required: false
        type: string

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record decision
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("source-scout-v1/output/editorial_decisions.json")
          try:
              rows = json.loads(path.read_text(encoding="utf-8"))
          except (FileNotFoundError, json.JSONDecodeError):
              rows = []
          rows.append({
              "candidate_id": os.environ["CANDIDATE_ID"],
              "decision": os.environ["DECISION"],
              "note": os.environ.get("NOTE", ""),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          })
          path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit decision
        run: |
          git config user.name "news-item-radar-bot"
          git config user.email "news-item-radar-bot@users.noreply.github.com"
          git add source-scout-v1/output/editorial_decisions.json
          git commit -m "chore: record editorial decision" || exit 0
          git push
