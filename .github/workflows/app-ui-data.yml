name: Build app UI data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app-ui-v1/*.py"
      - "app-ui-v1/index.html"
      - "app-ui-v1/app.js"
      - "app-ui-v1/styles.css"
      - ".github/workflows/app-ui-data.yml"
      - ".github/workflows/editorial-v4-fresh-cycle.yml"
      - "editorial-v4/output/latest.json"
      - "citizen-proposal-pilot/output/editorial_review_queue.json"
      - "citizen-proposal-pilot/output/editor_decisions.json"
      - "interest-radar-v2/output/youtube_review_queue.json"
      - "interest-radar-v2/output/youtube_editor_decisions.json"
  pull_request:
    paths:
      - "app-ui-v1/**"
      - "citizen-proposal-pilot/**"
      - "interest-radar-v2/build_youtube_review_queue.py"
      - "interest-radar-v2/publish_youtube_review_queue.py"
      - "interest-radar-v2/record_youtube_shadow_decision.py"
      - "interest-radar-v2/output/youtube_review_queue.json"
      - "interest-radar-v2/output/youtube_editor_decisions.json"
      - ".github/workflows/app-ui-data.yml"
      - ".github/workflows/citizen-proposal-shadow.yml"
      - ".github/workflows/publish-citizen-shadow.yml"
      - ".github/workflows/review-citizen-shadow.yml"
      - ".github/workflows/publish-youtube-shadow.yml"
      - ".github/workflows/review-youtube-shadow.yml"
  schedule:
    - cron: "15 3 * * *"
  workflow_run:
    workflows:
      - "Review editorial v4 card"
      - "Review district council shadow proposal"
      - "Review citizen signal shadow proposal"
      - "Review YouTube signal shadow proposal"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: app-ui-data-main
  cancel-in-progress: false

jobs:
  build-ui-data:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main outputs
        uses: actions/checkout@v4

      - name: Check UI JavaScript syntax
        run: node --check app-ui-v1/app.js

      - name: Test cross-source exploration contract
        run: python -X utf8 -m unittest discover -s app-ui-v1 -p "test_*.py" -v

      - name: Build normalized UI data
        run: python app-ui-v1/build_ui_data.py

      - name: Validate editorial candidate contract
        run: python editorial-v3/validate_candidate_contract.py

      - name: Commit changed UI data
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-ui-v1/data/latest.json
          git diff --cached --quiet || git commit -m "Update app UI data snapshot"
          git push
