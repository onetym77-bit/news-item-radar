name: Build app UI data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app-ui-v1/**"
      - ".github/workflows/app-ui-data.yml"
  schedule:
    - cron: "15 3 * * *"
  workflow_run:
    workflows:
      - "Collect source signals"
      - "Collect interest signals"
      - "Build daily item briefing"
      - "Watch 25 district council list windows"
      - "Evaluate Seoul audit questions (L4 shadow)"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: app-ui-data-main
  cancel-in-progress: false

jobs:
  build-ui-data:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main outputs
        uses: actions/checkout@v4

      - name: Test cross-source exploration contract
        run: python -X utf8 -m unittest discover -s app-ui-v1 -p "test_*.py" -v

      - name: Build normalized UI data
        run: python app-ui-v1/build_ui_data.py

      - name: Validate editorial candidate contract
        run: python editorial-v3/validate_candidate_contract.py

      - name: Commit changed UI data
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-ui-v1/data/latest.json
          git diff --cached --quiet || git commit -m "Update app UI data snapshot"
          git push
