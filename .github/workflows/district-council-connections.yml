name: Check all 25 district council connections

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "district-council-pilot/*.py"
      - "district-council-pilot/sources_25.json"
      - ".github/workflows/district-council-connections.yml"

permissions:
  contents: read

concurrency:
  group: district-connections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test parsers and observation states
        run: python -X utf8 -m unittest discover -s district-council-pilot -p 'test_*.py' -v
      - name: Validate existing system
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Check final two council recovery paths
        run: >-
          python -X utf8 district-council-pilot/collect_pilot.py
          --sources district-council-pilot/sources_25.json
          --per-source 2 --workers 2 --source-id seodaemun seocho
          --output district-council-pilot/output/connections
      - name: Add connection summary
        run: cat district-council-pilot/output/connections/pilot_latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: district-connections-${{ github.run_id }}
          path: district-council-pilot/output/connections/
          retention-days: 30
          if-no-files-found: warn
