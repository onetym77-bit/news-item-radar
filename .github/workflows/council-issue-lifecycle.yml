name: Archive and read all Seoul council minutes

on:
  workflow_dispatch:
    inputs:
      lookback_months:
        description: 최초 전량 아카이브 범위
        required: true
        default: "36"
        type: choice
        options:
          - "24"
          - "36"
          - "60"
      max_documents:
        description: 이번 실행에서 원문을 새로 저장할 최대 문서 수
        required: true
        default: "104"
        type: choice
        options:
          - "26"
          - "52"
          - "104"
          - "208"
      analysis_calls:
        description: 이번 실행에서 회의록 문맥을 읽을 최대 분석 횟수
        required: true
        default: "12"
        type: choice
        options:
          - "6"
          - "12"
          - "24"
  pull_request:
    paths:
      - "council-archive-v1/**"
      - ".github/workflows/council-issue-lifecycle.yml"
      - "district-council-pilot/clik_api.py"
      - "district-council-pilot/collect_pilot.py"
      - "district-council-pilot/sources_25.json"

permissions:
  contents: read

concurrency:
  group: council-minutes-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
      CLIK_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLIK_API_KEY || '' }}
      OPENAI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test archive and semantic-reading safety rules
        run: python -X utf8 -m unittest discover -s council-archive-v1 -p 'test_*.py' -v

      - name: Restore archive and progress
        if: ${{ github.event_name != 'pull_request' }}
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}
          restore-keys: |
            council-minutes-archive-v1-

      - name: Check official council pages for fresher meetings
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: >-
          python -X utf8 district-council-pilot/collect_pilot.py
          --sources district-council-pilot/sources_25.json
          --per-source 1
          --workers 3
          --output .runtime/official-watch
          --previous .runtime/council-archive/official_previous.json

      - name: Archive council minutes without search keywords
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 council-archive-v1/archive.py
          --lookback-months ${{ inputs.lookback_months }}
          --max-documents ${{ inputs.max_documents }}
          --page-size 50
          --official-observation .runtime/official-watch/pilot_latest.json

      - name: Preserve latest official-page observation
        if: ${{ github.event_name != 'pull_request' && hashFiles('.runtime/official-watch/pilot_latest.json') != '' }}
        run: cp .runtime/official-watch/pilot_latest.json .runtime/council-archive/official_previous.json

      - name: Read archived minutes by civic problem structure
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 council-archive-v1/analyze.py
          --max-calls ${{ inputs.analysis_calls }}
          --model gpt-5.6-luna

      - name: Save archive and analysis progress
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}

      - name: Check output boundaries
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archive = json.loads(Path("council-archive-v1/output/status_latest.json").read_text(encoding="utf-8"))
          analysis = json.loads(Path("council-archive-v1/output/analysis_latest.json").read_text(encoding="utf-8"))
          assert archive["schema"] == 1
          assert archive["mode"] == "KEYWORD_FREE_FULL_MINUTES_ARCHIVE"
          assert archive["source_count"] == 26
          assert archive["all_minutes_are_read_before_issue_selection"] is True
          assert archive["silence_is_not_resolution"] is True
          assert 0 <= archive["complete_source_count"] <= 26
          assert archive["error_attempt_count"] >= archive["error_count"]
          assert analysis["schema"] == 1
          assert analysis["mode"] == "FULL_TEXT_SEMANTIC_READING"
          assert analysis["document_count"] == archive["archived_total"]
          assert analysis["model_call_count"] <= int("${{ inputs.analysis_calls }}")
          assert analysis["consolidation_model_call_count"] in (0, 1)
          assert analysis["consolidation_status"] in ("NOT_RUN", "SUCCEEDED", "FAILED")
          assert analysis["consolidation_input_count"] >= analysis["consolidation_group_count"]
          if analysis["consolidation_status"] == "FAILED":
              assert analysis["consolidation_error_type"]
              assert analysis["consolidation_error_reason"]
          assert analysis["model_call_count"] == (
              analysis["chunk_model_call_count"]
              + analysis["consolidation_model_call_count"]
          )
          assert analysis["review_candidate_count"] <= analysis["candidate_total"]
          assert analysis["duplicate_collapsed_count"] == (
              analysis["candidate_total"] - analysis["review_candidate_count"]
          )
          forbidden = ("api_key", "CLIK_API_KEY", "OPENAI_API_KEY", "searchKeyword", '"body"')
          serialized = json.dumps({"archive": archive, "analysis": analysis}, ensure_ascii=False)
          assert not any(term in serialized for term in forbidden)
          for row in analysis["review_candidates"]:
              assert row["anchor_quote"]
              assert row["public_question"] != row["subject"]
              assert row["review_status"] == "UNREVIEWED"
              assert row["related_evidence_count"] >= 1
              assert row["related_document_count"] >= 1
              assert row["supporting_anchors"]
          PY

      - name: Upload archive and semantic review
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: council-minutes-review-${{ github.run_id }}
          path: |
            council-archive-v1/output/status_latest.json
            council-archive-v1/output/SUMMARY.md
            council-archive-v1/output/new_documents.jsonl.gz
            council-archive-v1/output/analysis_latest.json
            council-archive-v1/output/ANALYSIS_SUMMARY.md
            .runtime/official-watch/pilot_latest.json
          if-no-files-found: warn
          retention-days: 7
