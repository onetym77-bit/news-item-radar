name: Track recurring council issues

on:
  workflow_dispatch:
    inputs:
      lookback_months:
        description: 과거 회의록 탐색 범위
        required: true
        default: "18"
        type: choice
        options:
          - "12"
          - "18"
      max_seeds:
        description: 이번 실행에서 추적할 현재 의회 단서 수
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
  pull_request:
    paths:
      - "issue-lifecycle-v1/**"
      - ".github/workflows/council-issue-lifecycle.yml"
      - "district-council-pilot/clik_api.py"
      - "district-council-pilot/sources_25.json"

permissions:
  contents: read

concurrency:
  group: council-issue-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      CLIK_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLIK_API_KEY || '' }}
      OPENAI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test lifecycle safety rules
        run: python -X utf8 -m unittest discover -s issue-lifecycle-v1 -p 'test_*.py' -v
      - name: Backfill historical issue seeds
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 issue-lifecycle-v1/backfill.py
          --lookback-months ${{ inputs.lookback_months }}
          --minimum-age-months 9
          --max-docs 12
          --max-seeds 5
          --model gpt-5.6-luna
      - name: Track prior and follow-up council evidence
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 issue-lifecycle-v1/pipeline.py
          --seed-file source-scout-v1/output/daily_feed_latest.json
          --seed-file district-council-pilot/output/recent-l3/sample_latest.json
          --seed-file issue-lifecycle-v1/output/historical_seeds_latest.json
          --lookback-months ${{ inputs.lookback_months }}
          --max-seeds ${{ inputs.max_seeds }}
          --max-comparisons 12
          --model gpt-5.6-luna
      - name: Check redacted human-review output
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("issue-lifecycle-v1/output")
          data = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1
          assert data["source_count"] == 26
          assert data["automatic_briefing_write"] is False
          assert data["silence_is_unresolved"] is False
          assert data["comparison_count"] <= data["comparison_limit"] <= 30
          forbidden = {"body", "current_text", "api_key", "transcript"}

          def check(value):
              if isinstance(value, dict):
                  assert forbidden.isdisjoint(value)
                  for child in value.values():
                      check(child)
              elif isinstance(value, list):
                  for child in value:
                      check(child)

          check(data)
          for row in data["results"]:
              assert row["editorial_boundary"]
              for match in row["matches"]:
                  assert match["document_url"].startswith("https://")
                  assert match["anchor_quote"]
          PY
      - name: Upload lifecycle review
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: council-issue-lifecycle-${{ github.run_id }}
          path: |
            issue-lifecycle-v1/output/latest.json
            issue-lifecycle-v1/output/SUMMARY.md
            issue-lifecycle-v1/output/historical_seeds_latest.json
            issue-lifecycle-v1/output/HISTORICAL_SEEDS.md
          if-no-files-found: warn
          retention-days: 7
