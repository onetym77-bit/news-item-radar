name: Archive all Seoul council minutes

on:
  workflow_dispatch:
    inputs:
      lookback_months:
        description: 최초 전량 아카이브 범위
        required: true
        default: "36"
        type: choice
        options:
          - "24"
          - "36"
          - "60"
      max_documents:
        description: 이번 실행에서 원문을 새로 저장할 최대 문서 수
        required: true
        default: "104"
        type: choice
        options:
          - "26"
          - "52"
          - "104"
          - "208"
  pull_request:
    paths:
      - "council-archive-v1/**"
      - ".github/workflows/council-issue-lifecycle.yml"
      - "district-council-pilot/clik_api.py"
      - "district-council-pilot/collect_pilot.py"
      - "district-council-pilot/sources_25.json"

permissions:
  contents: read

concurrency:
  group: council-minutes-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
      CLIK_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLIK_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test archive safety and resume rules
        run: python -X utf8 -m unittest discover -s council-archive-v1 -p 'test_*.py' -v

      - name: Restore archive and progress
        if: ${{ github.event_name != 'pull_request' }}
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}
          restore-keys: |
            council-minutes-archive-v1-

      - name: Check official council pages for fresher meetings
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: >-
          python -X utf8 district-council-pilot/collect_pilot.py
          --sources district-council-pilot/sources_25.json
          --per-source 1
          --workers 3
          --output .runtime/official-watch
          --previous .runtime/council-archive/official_previous.json

      - name: Archive council minutes without search keywords
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 council-archive-v1/archive.py
          --lookback-months ${{ inputs.lookback_months }}
          --max-documents ${{ inputs.max_documents }}
          --page-size 50
          --official-observation .runtime/official-watch/pilot_latest.json

      - name: Preserve latest official-page observation
        if: ${{ github.event_name != 'pull_request' && hashFiles('.runtime/official-watch/pilot_latest.json') != '' }}
        run: cp .runtime/official-watch/pilot_latest.json .runtime/council-archive/official_previous.json

      - name: Save archive and progress
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}

      - name: Check archive report boundaries
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("council-archive-v1/output/status_latest.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1
          assert data["mode"] == "KEYWORD_FREE_FULL_MINUTES_ARCHIVE"
          assert data["source_count"] == 26
          assert data["all_minutes_are_read_before_issue_selection"] is True
          assert data["silence_is_not_resolution"] is True
          assert 0 <= data["complete_source_count"] <= 26
          forbidden = {"api_key", "CLIK_API_KEY", "searchKeyword"}
          assert not forbidden.intersection(json.dumps(data, ensure_ascii=False))
          PY

      - name: Upload archive progress and new documents
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: council-minutes-archive-${{ github.run_id }}
          path: |
            council-archive-v1/output/status_latest.json
            council-archive-v1/output/SUMMARY.md
            council-archive-v1/output/new_documents.jsonl.gz
            .runtime/official-watch/pilot_latest.json
          if-no-files-found: warn
          retention-days: 7
