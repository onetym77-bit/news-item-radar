name: Archive Seoul council minutes (collection only)

on:
  workflow_dispatch:
    inputs:
      lookback_months:
        description: 최초 전량 아카이브 범위
        required: true
        default: "36"
        type: choice
        options:
          - "24"
          - "36"
          - "60"
      max_documents:
        description: 이번 실행에서 원문을 새로 저장할 최대 문서 수
        required: true
        default: "104"
        type: choice
        options:
          - "26"
          - "52"
          - "104"
          - "208"
  pull_request:
    paths:
      - "council-archive-v1/**"
      - ".github/workflows/council-issue-lifecycle.yml"
      - "district-council-pilot/clik_api.py"
      - "district-council-pilot/collect_pilot.py"
      - "district-council-pilot/sources_25.json"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: write

concurrency:
  group: council-minutes-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUTF8: "1"
      CLIK_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLIK_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test archive and semantic-reading safety rules
        run: |
          python -X utf8 -m unittest discover -s council-archive-v1 -p 'test_*.py' -v
          python -X utf8 -m unittest discover -s district-council-pilot -p 'test_*.py' -v

      - name: Validate no new discovery-system errors
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python -X utf8 agent-system-v1/validate_discovery_system.py > "$RUNNER_TEMP/current-validation.log" 2>&1
          current_status=$?
          git worktree add --detach "$RUNNER_TEMP/discovery-base" "$BASE_SHA"
          (
            cd "$RUNNER_TEMP/discovery-base"
            python -X utf8 agent-system-v1/validate_discovery_system.py
          ) > "$RUNNER_TEMP/base-validation.log" 2>&1
          base_status=$?
          set -e
          cat "$RUNNER_TEMP/current-validation.log"
          CURRENT_STATUS="$current_status" BASE_STATUS="$base_status" python - <<'PY'
          import os
          from pathlib import Path

          def errors(path):
              return {
                  line
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line.startswith("ERROR:")
              }

          root = Path(os.environ["RUNNER_TEMP"])
          base = errors(root / "base-validation.log")
          current = errors(root / "current-validation.log")
          introduced = sorted(current - base)
          if introduced:
              raise SystemExit(
                  "New discovery-system validation errors:\n"
                  + "\n".join(introduced)
              )
          if int(os.environ["CURRENT_STATUS"]) not in (0, 1):
              raise SystemExit("Current validator ended unexpectedly")
          if int(os.environ["BASE_STATUS"]) not in (0, 1):
              raise SystemExit("Base validator ended unexpectedly")
          print(
              f"기존 오류 {len(base)}건, 현재 오류 {len(current)}건, "
              "신규 오류 0건"
          )
          PY

      - name: Restore archive and progress
        if: ${{ github.event_name != 'pull_request' }}
        id: archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}
          restore-keys: |
            council-minutes-archive-v1-

      - name: Collect recent minutes from official council pages
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: >-
          python -X utf8 district-council-pilot/collect_pilot.py
          --sources district-council-pilot/sources_25.json
          --per-source 4
          --workers 3
          --include-seoul-city
          --output .runtime/official-watch
          --previous .runtime/council-archive/official_previous.json
          --archive-output .runtime/official-watch/official_documents.jsonl.gz

      - name: Archive official minutes and supplement from portal API
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 council-archive-v1/archive.py
          --lookback-months ${{ inputs.lookback_months }}
          --max-documents ${{ inputs.max_documents }}
          --page-size 50
          --official-observation .runtime/official-watch/pilot_latest.json
          --official-documents .runtime/official-watch/official_documents.jsonl.gz

      - name: Preserve latest official-page observation
        if: ${{ github.event_name != 'pull_request' && hashFiles('.runtime/official-watch/pilot_latest.json') != '' }}
        run: cp .runtime/official-watch/pilot_latest.json .runtime/council-archive/official_previous.json

      - name: Save archive progress without model analysis
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: .runtime/council-archive
          key: council-minutes-archive-v1-${{ github.run_id }}

      - name: Check output boundaries
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          archive = json.loads(Path("council-archive-v1/output/status_latest.json").read_text(encoding="utf-8"))
          assert archive["schema"] == 1
          assert archive["mode"] == "KEYWORD_FREE_FULL_MINUTES_ARCHIVE"
          assert archive["source_count"] == 26
          assert archive["all_minutes_are_read_before_issue_selection"] is True
          assert archive["silence_is_not_resolution"] is True
          assert 0 <= archive["complete_source_count"] <= 26
          assert archive["historical_window_complete_source_count"] == archive["complete_source_count"]
          assert 0 <= archive["official_recent_bodies"] <= archive["official_recent_expected"]
          assert 0 <= archive["official_recent_archive_eligible"] <= archive["official_recent_expected"]
          assert 0 <= archive["official_recent_body_complete_source_count"] <= 26
          assert 0 <= archive["official_recent_metadata_complete_source_count"] <= 26
          assert archive["official_recent_not_added_count"] >= 0
          assert archive["error_attempt_count"] >= archive["error_count"]
          forbidden = ("api_key", "CLIK_API_KEY", "OPENAI_API_KEY", "searchKeyword", '"body"')
          serialized = json.dumps(archive, ensure_ascii=False)
          assert not any(term in serialized for term in forbidden)
          PY

      - name: Persist collection status only; keep old analysis unchanged
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "news-item-radar-bot"
          git config user.email "news-item-radar-bot@users.noreply.github.com"
          git add council-archive-v1/output/status_latest.json council-archive-v1/output/SUMMARY.md
          if git diff --cached --quiet; then
            echo "No derived council snapshot change."
            exit 0
          fi
          git commit -m "Update council archive collection status"
          bash .github/scripts/push-with-rebase.sh main

      - name: Upload collected minutes without semantic review
        if: ${{ always() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: council-minutes-review-${{ github.run_id }}
          path: |
            council-archive-v1/output/status_latest.json
            council-archive-v1/output/SUMMARY.md
            council-archive-v1/output/new_documents.jsonl.gz
            .runtime/official-watch/pilot_latest.json
          if-no-files-found: warn
          retention-days: 7
