name: Test five district council sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "district-council-pilot/**"
      - ".github/workflows/district-council-pilot.yml"

permissions:
  contents: read

concurrency:
  group: district-council-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check sampling and empty-page regressions
        run: python -X utf8 -m unittest discover -s district-council-pilot -p 'test_*.py' -v
      - name: Validate existing discovery system
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Collect fixed official-list sample
        run: python -X utf8 district-council-pilot/collect_pilot.py
      - name: Show collection diagnostics
        run: cat district-council-pilot/output/pilot_latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: district-council-pilot-${{ github.run_id }}
          path: district-council-pilot/output/
          retention-days: 30
          if-no-files-found: warn
