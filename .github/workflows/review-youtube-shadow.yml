name: Review YouTube signal shadow proposal

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: 유튜브 신호 검증 전용 카드에 표시된 판정 ID
        required: true
        type: string
      decision:
        description: PROMISING 검토 가치 있음 / HOLD 보류 / DISCARD 기각
        required: true
        type: choice
        options: [PROMISING, HOLD, DISCARD]
      note:
        description: 판정 이유 (선택)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: youtube-signal-state
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test YouTube signal queue and exact-ID guard
        run: python -X utf8 -m unittest discover -s interest-radar-v2 -p 'test_*youtube*.py' -v
      - name: Record exact-ID decision
        env:
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
        run: >-
          python -X utf8 interest-radar-v2/record_youtube_shadow_decision.py
          --id "$PROPOSAL_ID"
          --decision "$DECISION"
          --note "$NOTE"
      - name: Commit YouTube signal decision only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interest-radar-v2/output/youtube_editor_decisions.json
          test "$(git diff --cached --name-only)" = "interest-radar-v2/output/youtube_editor_decisions.json"
          git commit -m "Record YouTube signal editor decision"
          git pull --rebase origin main
          git push origin HEAD:main
