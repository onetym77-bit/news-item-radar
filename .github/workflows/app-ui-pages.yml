name: Deploy app UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app-ui-v1/**"
      - ".github/workflows/app-ui-pages.yml"
  workflow_run:
    workflows:
      - "Build app UI data"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static UI
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-ui-v1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
