name: Review citizen proposal experience shadow

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model
        required: false
        default: gpt-5.6-luna
        type: string
  schedule:
    - cron: "20 23 * * 0,2" # Mon/Wed 08:20 KST
  pull_request:
    paths:
      - "citizen-proposal-pilot/**"
      - "editorial-v4/**"
      - ".github/workflows/citizen-proposal-shadow.yml"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: read

concurrency:
  group: citizen-proposal-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run citizen and editorial regression tests
        run: |
          python -X utf8 -m unittest discover -s citizen-proposal-pilot -p 'test_*.py' -v
          python -X utf8 -m unittest editorial-v4/test_pipeline.py -v
      - name: Validate discovery system
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Collect five bounded official proposals
        run: python -X utf8 citizen-proposal-pilot/watch.py
      - name: Validate citizen shadow contract without a model call
        if: github.event_name == 'pull_request'
        run: >-
          python -X utf8 editorial-v4/pipeline.py
          --dry-run
          --citizen-shadow citizen-proposal-pilot/output/observation_latest.json
          --citizen-shadow-only
          --output citizen-proposal-pilot/output/editorial_shadow_latest.json
      - name: Review direct-experience statements only
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ inputs.model || 'gpt-5.6-luna' }}
        run: >-
          python -X utf8 editorial-v4/pipeline.py
          --model "$MODEL"
          --citizen-shadow citizen-proposal-pilot/output/observation_latest.json
          --citizen-shadow-only
          --output citizen-proposal-pilot/output/editorial_shadow_latest.json
      - name: Build bounded citizen-signal review queue candidate
        run: >-
          python -X utf8 citizen-proposal-pilot/build_review_queue.py
          --input citizen-proposal-pilot/output/editorial_shadow_latest.json
          --queue citizen-proposal-pilot/output/editorial_review_queue.json
          --decisions citizen-proposal-pilot/output/editor_decisions.json
          --output citizen-proposal-pilot/output/editorial_review_queue_next.json
      - name: Check privacy and shadow-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          observation = json.loads(Path("citizen-proposal-pilot/output/observation_latest.json").read_text(encoding="utf-8"))
          result = json.loads(Path("citizen-proposal-pilot/output/editorial_shadow_latest.json").read_text(encoding="utf-8"))
          assert observation["privacy"]["author_name_stored"] is False
          assert observation["privacy"]["contact_stored"] is False
          assert observation["privacy"]["full_body_stored"] is False
          queue = json.loads(Path("citizen-proposal-pilot/output/editorial_review_queue_next.json").read_text(encoding="utf-8"))
          assert result["proposals"] == []
          assert queue["mode"] == "CITIZEN_SIGNAL_SHADOW"
          for item in queue.get("items", []):
              assert len(item["anchor_quote"]) <= 240
              assert item["production_eligible"] is False
              assert item["briefing_output"] == "NONE"
          for item in result.get("shadow_reviews", []):
              assert item["family"] == "시민제안"
              assert item["production_eligible"] is False
              assert item["briefing_output"] == "NONE"
          PY
      - name: Publish bounded summary
        if: always()
        run: |
          if [ -f citizen-proposal-pilot/output/review_queue_latest.md ]; then
            cat citizen-proposal-pilot/output/review_queue_latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload seven-day shadow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: citizen-proposal-shadow-${{ github.run_id }}
          path: |
            citizen-proposal-pilot/output/observation_latest.json
            citizen-proposal-pilot/output/review_queue_latest.md
            citizen-proposal-pilot/output/editorial_shadow_latest.json
            citizen-proposal-pilot/output/processed_ids_next.json
            citizen-proposal-pilot/output/editorial_review_queue_next.json
          if-no-files-found: error
          retention-days: 7

  persist-history:
    if: github.event_name != 'pull_request'
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out current main for the bounded state commit
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Download this successful run's state candidate
        uses: actions/download-artifact@v8
        with:
          name: citizen-proposal-shadow-${{ github.run_id }}
          path: citizen-history
      - name: Validate state-only contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          path = Path("citizen-history/processed_ids_next.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          assert document.get("schema") == 1
          rows = document.get("processed")
          assert isinstance(rows, list) and len(rows) <= 2000
          ids = set()
          for row in rows:
              assert set(row) == {"proposal_id", "first_processed_at_kst", "detail_sha256"}
              proposal_id = str(row["proposal_id"])
              assert proposal_id.isdigit() and proposal_id not in ids
              assert isinstance(row["first_processed_at_kst"], str)
              digest = row["detail_sha256"]
              assert digest is None or re.fullmatch(r"[0-9a-f]{64}", digest)
              ids.add(proposal_id)
          PY
      - name: Commit processed IDs only
        run: |
          cp citizen-history/processed_ids_next.json citizen-proposal-pilot/state/processed_ids.json
          git add citizen-proposal-pilot/state/processed_ids.json
          if git diff --cached --quiet; then
            echo "No new proposal IDs to record."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "citizen-proposal-pilot/state/processed_ids.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record processed citizen proposal IDs"
          git pull --rebase origin main
          git push origin HEAD:main
