name: Probe citizen proposal statements

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "citizen-proposal-pilot/**"
      - ".github/workflows/citizen-proposal-pilot.yml"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test extraction and classification gates
        run: python -X utf8 -m unittest discover -s citizen-proposal-pilot -p 'test_*.py' -v
      - name: Validate the discovery system
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Read only the first five official proposals
        run: python -X utf8 citizen-proposal-pilot/watch.py
      - name: Upload bounded derived review queue
        uses: actions/upload-artifact@v7
        with:
          name: citizen-proposal-pilot-${{ github.run_id }}
          path: |
            citizen-proposal-pilot/output/observation_latest.json
            citizen-proposal-pilot/output/review_queue_latest.md
          if-no-files-found: error
          retention-days: 7
