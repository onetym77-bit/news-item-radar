name: Build editorial review v4

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * 1,3"
  pull_request:
    paths:
      - "editorial-v4/**"
      - "interest-radar-v2/review_youtube_context.py"
      - "interest-radar-v2/build_youtube_review_queue.py"
      - "interest-radar-v2/publish_youtube_review_queue.py"
      - "interest-radar-v2/record_youtube_shadow_decision.py"
      - "interest-radar-v2/output/youtube_review_queue.json"
      - "interest-radar-v2/output/youtube_editor_decisions.json"
      - "interest-radar-v2/test_review_youtube_context.py"
      - "interest-radar-v2/test_youtube_classification.py"
      - "interest-radar-v2/collect_source_material_v2_1.py"
      - "interest-radar-v2/config/editorial_lenses.json"
      - ".github/workflows/editorial-v4.yml"
      - ".github/workflows/collect-interest-signals.yml"
      - ".github/workflows/publish-youtube-shadow.yml"
      - ".github/workflows/review-youtube-shadow.yml"

permissions:
  contents: write

concurrency:
  group: editorial-v4-main
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate pipeline
        run: python -X utf8 -m unittest discover -s editorial-v4 -p "test_*.py" -v
      - name: Validate fixed editorial quality regressions
        run: python -X utf8 editorial-v4/evaluate_quality_regression.py
      - name: Validate YouTube semantic shadow
        run: python -X utf8 -m unittest discover -s interest-radar-v2 -p "test_*youtube*.py" -v
      - name: Dry-run input mapping on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: python -X utf8 editorial-v4/pipeline.py --dry-run
      - name: Dry-run YouTube semantic prefilter on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: python -X utf8 interest-radar-v2/review_youtube_context.py --dry-run --output editorial-v4/output/youtube_shadow_latest.json
      - name: Validate source policy
        run: python agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Review YouTube citizen signals in shadow mode
        if: ${{ github.event_name != 'pull_request' }}
        run: python -X utf8 interest-radar-v2/review_youtube_context.py --model gpt-5.6-luna --output editorial-v4/output/youtube_shadow_latest.json
      - name: Build bounded YouTube review queue candidate
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 interest-radar-v2/build_youtube_review_queue.py
          --input editorial-v4/output/youtube_shadow_latest.json
          --queue interest-radar-v2/output/youtube_review_queue.json
          --decisions interest-radar-v2/output/youtube_editor_decisions.json
          --output editorial-v4/output/youtube_review_queue_next.json
      - name: Generate review questions
        if: ${{ github.event_name != 'pull_request' }}
        run: python -X utf8 editorial-v4/pipeline.py --model gpt-5.6-luna
      - name: Upload integrated head audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integrated-head-audit-${{ github.run_id }}
          path: editorial-v4/output/latest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload YouTube semantic shadow
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-semantic-shadow-${{ github.run_id }}
          path: |
            editorial-v4/output/youtube_shadow_latest.json
            editorial-v4/output/youtube_review_queue_next.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit derived review only
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-v4/output/latest.json
          git diff --cached --quiet || git commit -m "Update editorial v4 review"
          git pull --rebase origin main
          git push origin HEAD:main

