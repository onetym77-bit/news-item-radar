name: Review frozen substantive source sample

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed comparison run ID (default: September 17 fixed sample)"
        required: true
        type: string
        default: "35202083001"

permissions:
  contents: read
  actions: read

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download the immutable comparison artifact
        uses: actions/download-artifact@v7
        with:
          name: substantive-source-comparison-${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          path: frozen-sample
      - name: Recalculate only the human-review result
        run: |
          python -X utf8 source-onboarding-v1/review_substantive_snapshot.py \
            --snapshot-json frozen-sample/comparison.json \
            --reviews-csv source-onboarding-v1/substantive_reviews_2026-09-17.csv \
            --output-dir source-onboarding-v1/output/substantive-human-review
      - name: Publish editorial summary
        if: always()
        run: |
          if [ -f source-onboarding-v1/output/substantive-human-review/REVIEW_SUMMARY.md ]; then
            cat source-onboarding-v1/output/substantive-human-review/REVIEW_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload derived review result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: substantive-human-review-${{ github.run_id }}
          path: source-onboarding-v1/output/substantive-human-review/
          if-no-files-found: error
          retention-days: 30
