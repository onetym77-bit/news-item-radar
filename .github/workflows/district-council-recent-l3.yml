name: Review recent district minutes L3 shadow

on:
  schedule:
    - cron: "50 8 * * 1,3"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      max_docs:
        description: Maximum current verified documents to review
        required: true
        default: "5"
        type: choice
        options:
          - "3"
          - "5"
  pull_request:
    paths:
      - "district-council-pilot/review_recent_minutes_l3.py"
      - "district-council-pilot/clik_api.py"
      - "district-council-pilot/sources_25.json"
      - "district-council-pilot/test_clik_api.py"
      - "district-council-pilot/test_review_recent_minutes_l3.py"
      - "district-council-pilot/record_shadow_decision.py"
      - "district-council-pilot/test_record_shadow_decision.py"
      - "district-council-pilot/interpret_l3_context.py"
      - "district-council-pilot/collect_body_l2.py"
      - "district-council-pilot/watch_new_minutes.py"
      - "district-council-pilot/RECENT_L3_RUNBOOK.md"
      - "editorial-v4/pipeline.py"
      - "editorial-v4/test_pipeline.py"
      - "editorial-v3/SYSTEM_ARCHITECTURE.md"
      - ".github/workflows/district-council-recent-l3.yml"
      - ".github/workflows/review-district-shadow.yml"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: read

concurrency:
  group: district-recent-l3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      OPENAI_API_KEY: ${{ github.event_name != 'pull_request' && secrets.OPENAI_API_KEY || '' }}
      CLIK_API_KEY: ${{ github.event_name != 'pull_request' && secrets.CLIK_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test district source and recent L3 guards
        run: python -X utf8 -m unittest discover -s district-council-pilot -p 'test_*.py' -v
      - name: Test editorial shadow boundary
        run: python -X utf8 -m unittest discover -s editorial-v4 -p 'test_*.py' -v
      - name: Validate discovery policy
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
      - name: Build no-network contract output on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: python -X utf8 district-council-pilot/review_recent_minutes_l3.py --offline --max-docs 0
      - name: Review bounded recent documents
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 district-council-pilot/review_recent_minutes_l3.py
          --model gpt-5.6-luna
          --max-docs ${{ github.event_name == 'workflow_dispatch' && inputs.max_docs || '5' }}
      - name: Check bounded shadow output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("district-council-pilot/output/recent-l3")
          data = json.loads((root / "sample_latest.json").read_text(encoding="utf-8"))
          history = json.loads((root / "reviewed_documents_next.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1 and data["source_count"] == 25
          assert data["selected_count"] == len(data["results"]) <= 5
          assert data["coverage"] == "MAX_FIVE_CURRENT_L2_VERIFIED_DOCUMENTS"
          assert data["briefing_output"] == "NONE"
          assert data["automatic_ledger_write"] is False
          assert history["schema"] == 1
          keys = [row["key"] for row in history["reviewed_documents"]]
          assert len(keys) == len(set(keys)) <= 500
          for row in data["results"]:
              assert row["selection_reason"] in {
                  "NEW_IN_VISIBLE_WINDOW", "LATEST_UNREVIEWED_BOOTSTRAP"}
              assert "body" not in row and "parts" not in row
              assert "evidence_context" not in row and "body_sha256" not in row
              if "verification_card" in row:
                  assert row["semantic_status"] == "REVIEW"
                  if data["mode"] != "CONTEXT_ONLY":
                      assert row["editorial_review"]["verdict"] in {
                          "PURSUE", "VERIFY_FIRST", "LOW_PRIORITY"}
              if "held_cue" in row:
                  assert row["semantic_status"] == "HOLD"
          PY
      - name: Build no-cost editorial shadow bridge on PR
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          python -X utf8 editorial-v4/pipeline.py
          --dry-run
          --district-shadow district-council-pilot/output/recent-l3/sample_latest.json
          --district-shadow-only
          --output district-council-pilot/output/recent-l3/editorial_shadow_latest.json
      - name: Independently review district leads for artifact only
        if: ${{ github.event_name != 'pull_request' }}
        run: >-
          python -X utf8 editorial-v4/pipeline.py
          --model gpt-5.6-luna
          --district-shadow district-council-pilot/output/recent-l3/sample_latest.json
          --district-shadow-only
          --output district-council-pilot/output/recent-l3/editorial_shadow_latest.json
      - name: Check editorial shadow boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("district-council-pilot/output/recent-l3/editorial_shadow_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["schema"] == 1
          assert data["proposals"] == []
          assert data["model_calls"] <= 2
          assert data["source_inputs"] <= 5
          assert data["model_inputs"] <= 5
          forbidden = {"body", "parts", "evidence_context", "body_sha256"}

          def check(value):
              if isinstance(value, dict):
                  assert forbidden.isdisjoint(value)
                  for child in value.values():
                      check(child)
              elif isinstance(value, list):
                  for child in value:
                      check(child)

          check(data)
          for row in data["shadow_reviews"]:
              assert row["family"] == "25개 자치구의회"
              assert row["source_stage"] == "L3 그림자 검토"
              assert row["production_eligible"] is False
              assert row["briefing_output"] == "NONE"
              assert row["status"] == "검증 전용·최종 후보 아님"
          PY
      - name: Upload bounded recent L3 report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: district-recent-l3-${{ github.run_id }}
          path: |
            district-council-pilot/output/recent-l3/sample_latest.json
            district-council-pilot/output/recent-l3/SUMMARY.md
            district-council-pilot/output/recent-l3/reviewed_documents_next.json
            district-council-pilot/output/recent-l3/editorial_shadow_latest.json
          if-no-files-found: warn
          retention-days: 7

  persist-history:
    needs: review
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact reviewed main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Download exact reviewed history
        uses: actions/download-artifact@v8
        with:
          name: district-recent-l3-${{ github.run_id }}
          path: district-council-pilot/output/recent-l3-run
      - name: Validate and place deduplication history
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          source = Path("district-council-pilot/output/recent-l3-run/reviewed_documents_next.json")
          value = json.loads(source.read_text(encoding="utf-8"))
          assert value["schema"] == 1
          rows = value["reviewed_documents"]
          assert len(rows) <= 500
          keys = [row["key"] for row in rows]
          assert len(keys) == len(set(keys))
          assert all(re.fullmatch(r"[0-9a-f]{24}", key) for key in keys)
          target = Path("district-council-pilot/output/recent-l3/reviewed_documents.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n",
                            encoding="utf-8")

          shadow_path = Path("district-council-pilot/output/recent-l3-run/editorial_shadow_latest.json")
          shadow = json.loads(shadow_path.read_text(encoding="utf-8"))
          assert shadow["schema"] == 1
          assert shadow["proposals"] == []
          forbidden = {"body", "parts", "evidence_context", "body_sha256"}

          def check(item):
              if isinstance(item, dict):
                  assert forbidden.isdisjoint(item)
                  for child in item.values():
                      check(child)
              elif isinstance(item, list):
                  for child in item:
                      check(child)

          queue_path = Path("district-council-pilot/output/recent-l3/editorial_review_queue.json")
          if queue_path.is_file():
              queue = json.loads(queue_path.read_text(encoding="utf-8"))
          else:
              queue = {"schema": 1, "updated_at_utc": None, "source_run_id": None, "items": []}
          assert queue.get("schema") == 1 and isinstance(queue.get("items"), list)
          known = {str(item["id"]) for item in queue["items"]}
          added = False
          for item in shadow.get("shadow_reviews", []):
              check(item)
              assert item["family"] == "25개 자치구의회"
              assert item["production_eligible"] is False
              assert item["briefing_output"] == "NONE"
              if str(item["id"]) not in known:
                  queue["items"].append(item)
                  known.add(str(item["id"]))
                  added = True
          queue["items"] = queue["items"][-50:]
          if added:
              queue["updated_at_utc"] = shadow.get("generated_at_utc")
              queue["source_run_id"] = os.environ["GITHUB_RUN_ID"]
          queue_path.write_text(
              json.dumps(queue, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --exit-code -- agent-system-v1/ITEM_LEDGER.csv
          git diff --exit-code -- agent-system-v1/QUESTION_QUALITY_AUDIT.csv
      - name: Persist identity history and redacted editorial queue only
        shell: bash
        run: |
          git config user.name "news-item-radar-bot"
          git config user.email "news-item-radar-bot@users.noreply.github.com"
          git add -f district-council-pilot/output/recent-l3/reviewed_documents.json
          git add -f district-council-pilot/output/recent-l3/editorial_review_queue.json
          git diff --cached --exit-code -- agent-system-v1/ITEM_LEDGER.csv
          git diff --cached --exit-code -- agent-system-v1/QUESTION_QUALITY_AUDIT.csv
          if ! git diff --cached --quiet; then
            git commit -m "Record reviewed district minutes for run $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi

