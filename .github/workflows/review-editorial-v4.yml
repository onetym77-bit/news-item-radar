name: Review editorial v4 proposal

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: 검토안 카드에 표시된 ID
        required: true
        type: string
      decision:
        description: COMPLETE 취재 검토 완료 / DISCARD 기각 / HOLD 보류
        required: true
        type: choice
        options: [COMPLETE, DISCARD, HOLD]
      note:
        description: 판정 이유 (선택)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: editorial-v4-decision
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact-ID decision
        env:
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          DECISION: ${{ inputs.decision }}
          NOTE: ${{ inputs.note }}
        run: python -X utf8 editorial-v4/record_decision.py --id "$PROPOSAL_ID" --decision "$DECISION" --note "$NOTE"
      - name: Commit decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-v4/decisions.json
          git commit -m "Record editorial v4 human decision"
          git pull --rebase origin main
          git push origin HEAD:main
