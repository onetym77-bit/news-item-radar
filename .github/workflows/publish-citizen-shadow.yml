name: Publish citizen signal shadow queue

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 성공한 시민제안 그림자 실행 번호
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: citizen-proposal-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate source run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          test -n "$RUN_ID"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.name')" = "Review citizen proposal experience shadow"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_branch')" = "main"
      - name: Download validated queue candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: >-
          gh run download "$RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "citizen-proposal-shadow-$RUN_ID"
          --dir citizen-shadow-artifact
      - name: Merge candidate with current decisions
        run: >-
          python -X utf8 citizen-proposal-pilot/publish_review_queue.py
          --candidate citizen-shadow-artifact/editorial_review_queue_next.json
          --current citizen-proposal-pilot/output/editorial_review_queue.json
          --decisions citizen-proposal-pilot/output/editor_decisions.json
          --output citizen-proposal-pilot/output/editorial_review_queue_published.json
      - name: Test decision and privacy guards
        run: python -X utf8 -m unittest discover -s citizen-proposal-pilot -p 'test_*.py' -v
      - name: Commit approved queue only
        run: |
          cp citizen-proposal-pilot/output/editorial_review_queue_published.json citizen-proposal-pilot/output/editorial_review_queue.json
          git add citizen-proposal-pilot/output/editorial_review_queue.json
          if git diff --cached --quiet; then
            echo "No new citizen signal card to publish."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "citizen-proposal-pilot/output/editorial_review_queue.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish approved citizen signal review queue"
          bash .github/scripts/push-with-rebase.sh main
