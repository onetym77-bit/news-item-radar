name: Collect interest signals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1,3"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public interest signals
        run: python interest-signal-pilot/collect_interest_signals.py
      - name: Commit derived signal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interest-signal-pilot/output/interest_signals_latest.json
          git diff --cached --quiet || git commit -m "Update interest signal snapshot"
          git push
