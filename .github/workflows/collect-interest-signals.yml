name: Collect interest signals

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-interest-signals-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh bounded YouTube video ledger
        run: python -X utf8 interest-radar-v2/collect_source_material_v2_1.py
      - name: Collect public interest signals
        run: python interest-signal-pilot/collect_interest_signals.py
      - name: Build human review queue
        run: python interest-signal-pilot/build_review_queue.py
      - name: Assess matched publisher bodies (up to six paid model calls)
        run: python interest-signal-pilot/analyze_news_context.py --max-items 12 --max-model-calls 6
      - name: Commit derived signal snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interest-signal-pilot/output/interest_signals_latest.json interest-signal-pilot/output/review_queue_latest.json
          git add interest-radar-v2/output/youtube_signal_ledger_v2_1.json
          git add interest-radar-v2/output/youtube_query_health_v2_3.json
          git add interest-radar-v2/output/youtube_api_usage_v2_3.json
          if [ -f interest-radar-v2/output/youtube_quota_state.json ]; then
            git add interest-radar-v2/output/youtube_quota_state.json
          fi
          git diff --cached --quiet || git commit -m "Update interest and YouTube signal state"
          bash .github/scripts/push-with-rebase.sh main
