name: Sample Seoul audit details L2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source-onboarding-v1/**"
      - ".github/workflows/source-onboarding-audit-l2.yml"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: read

concurrency:
  group: audit-l2-sample-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source maturity registry
        run: python -X utf8 source-onboarding-v1/thin_source_contract.py
      - name: Test fail-closed L2 collector
        run: python -X utf8 -m unittest discover -s source-onboarding-v1 -p 'test_*.py' -v
      - name: Sample at most five official detail pages
        run: python -X utf8 source-onboarding-v1/collect_audit_l2.py --output-dir source-onboarding-v1/output/audit-l2
      - name: Publish derived-only summary
        if: always()
        run: |
          if [ -f source-onboarding-v1/output/audit-l2/SUMMARY.md ]; then
            cat source-onboarding-v1/output/audit-l2/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bounded derived sample
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: seoul-audit-l2-${{ github.run_id }}
          path: source-onboarding-v1/output/audit-l2/
          if-no-files-found: error
          retention-days: 7
