name: Validate rebuild operation boundaries

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "rebuild-v1/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "rebuild-v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python -X utf8 -m unittest discover -s rebuild-v1 -p 'test_*.py' -v
