name: Validate new source maturity gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source-onboarding-v1/**"
      - ".github/workflows/source-onboarding-v1.yml"
      - ".github/workflows/source-onboarding-l0-batch.yml"
      - ".github/workflows/source-onboarding-l1-batch.yml"
      - "agent-system-v1/SYSTEM_MANIFEST.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Check out without write credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source maturity registry
        run: python -X utf8 source-onboarding-v1/thin_source_contract.py
      - name: Test fail-closed source contracts
        run: python -X utf8 -m unittest discover -s source-onboarding-v1 -p 'test_*.py' -v
      - name: Validate discovery system
        run: python -X utf8 agent-system-v1/validate_discovery_system.py --allow-missing-source-reports
